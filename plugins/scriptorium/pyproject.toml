[project]
name = "scriptorium-scripts"
version = "0.1.0"
description = "Python scripts backing the Scriptorium Claude Code plugin skills"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.10",
    "pillow>=10.4",
    "jinja2>=3.1",
    "reportlab>=4.2",
    "pyyaml>=6.0",
    "python-pptx>=1.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_tesseract: needs the tesseract binary",
    "requires_libreoffice: needs LibreOffice (soffice) -- skipped in default CI",
]
addopts = "--cov=lib --cov=skills --cov-report=term-missing"
